name: 📡 Daily Tech News Digest

on:
  schedule:
    - cron: '5 10 * * *'   # 19:05 JST = 10:05 UTC
  workflow_dispatch:        # 手動実行
  push:
    branches: [main]        # feeds.yml やコードがマージされたら即反映
    paths:
      - 'feeds.yml'
      - 'generate_news.py'
      - 'jev_client.py'
      - 'requirements.txt'
      - '.github/workflows/daily-news.yml'
      - 'render.py'
      - 'assets/**'

# gh-pages への push のみ許可(それ以外は読み取り専用)
permissions:
  contents: write

# 同時実行を避ける(gh-pages への push 競合防止)
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v5

      # 既存アーカイブ一覧の生成用に gh-pages を取得(初回は存在しないので失敗を許容)
      - name: Checkout gh-pages (existing archive)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: _pages

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news digest
        env:
          GH_OWNER:  ${{ github.repository_owner }}
          GH_REPO:   ${{ github.event.repository.name }}
          PAGES_URL: 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
          # Jev API キー(Settings → Secrets and variables → Actions に登録)
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: python generate_news.py

      - name: Verify output
        run: |
          test -s dist/index.html
          find dist -name "*.html" | sort
          if grep -rE "JEV_API_KEY|ghp_|github_pat_" dist/; then
            echo "❌ Potential secret found in output"; exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true       # 過去のアーカイブを削除しない
          enable_jekyll: false   # .nojekyll を配置
          commit_message: "📡 Digest #${{ github.run_number }}"

      - name: Notify (ntfy.sh, optional)
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -z "$NTFY_TOPIC" ] && { echo "NTFY_TOPIC not set, skip"; exit 0; }
          curl -s -o /dev/null \
            -H "Title: Tech News Digest" \
            -H "Click: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            -d "$(TZ=Asia/Tokyo date '+%Y/%m/%d') のテックニュースが更新されました" \
            "https://ntfy.sh/${NTFY_TOPIC}"
