name: ✅ Validate feeds.yml / Tests

on:
  pull_request:
    paths:
      - 'feeds.yml'
      - 'scripts/**'
      - 'jev_client.py'
      - 'generate_news.py'
      - 'render.py'
      - 'tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python scripts/validate_feeds.py
