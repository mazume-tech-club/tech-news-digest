# 収集対象RSS/Atomフィードの一覧
#
# 記事(フィード)を追加したい場合は、このファイルに1件追記してPull Requestを出してください。
# マージされると、次回(または main への push 時)のGitHub Actionsで自動的にサイトへ反映されます。
# 詳しくは CONTRIBUTING.md を参照。
#
# フィード1件のフィールド:
#   name      : 表示名(必須)
#   url       : RSS/Atom/RDF の URL(必須・https 推奨)
#   category  : 下の categories の id のどれか(必須)
#   lang      : ja または en(省略時 ja)。en は日本語タイトルに自動翻訳される
#   enabled   : false にすると収集しない(省略時 true)
#   max_items : このフィードから取り込む最大件数(省略時 settings.max_items_per_feed)

settings:
  lookback_hours: 168       # この時間より古い記事は除外(日付なしは含める)
  max_items_per_feed: 10
  show_per_category: 20     # カテゴリごとに最初から表示する件数(残りは折りたたみ)

# 表示順 = この並び順
#   id, title(必須)
#   sort: likes  … いいね数の多い順に表示する(省略時は Jev の重要度スコア順)
#   mode: heat   … Jev を「重要度」ではなく「アツさ」(面白さ・共感の広がり)で判定し、「アツさ」と表示する
categories:
  - { id: security, title: セキュリティ }
  - { id: ai,       title: AI・機械学習 }
  - { id: cloud,    title: インフラ・クラウド }
  - { id: gcp,      title: Google Cloud }
  - { id: general,  title: 総合テックニュース }
  - { id: embedded, title: 組み込み・ラズパイ・電子工作 }
  - { id: qiita,    title: Qiita 人気記事, sort: likes, mode: heat }
  - { id: zenn,     title: Zenn 人気記事,  sort: likes, mode: heat }
  - { id: gadget,   title: PC・タブレット・ガジェット }
  - { id: corp,     title: 企業テックブログ }
  - { id: person,   title: 個人ブログ }

